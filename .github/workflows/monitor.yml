name: Beyblade Stock Monitor

on:
  schedule:
    # 每 1 分鐘執行一次
    # 注意：GitHub Actions 官方不保證準時觸發，整點附近可能會延遲到 2~3 分鐘才真正執行
    # 這個 repo 是 Public，Actions 分鐘數不限額，可以放心用這個頻率
    - cron: "* * * * *"
  workflow_dispatch: {} # 允許在 GitHub 網頁上手動點擊執行，方便測試

permissions:
  contents: write # 需要寫入權限才能把最新的商品清單存回 repo

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_products.json data/bot_state.json
          git diff --staged --quiet || git commit -m "更新商品清單與機器人狀態 [skip ci]"
          git push
