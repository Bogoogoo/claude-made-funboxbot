name: Beyblade Stock Monitor

on:
  schedule:
    # 每 5 分鐘執行一次（GitHub Actions 官方建議的最短間隔，太頻繁可能不準時觸發）
    # 若 repo 是 Private，這個頻率每月約用掉 4000~8000 分鐘，會超過免費額度 2000 分鐘
    # 建議搭配 Public repo 使用（Actions 分鐘數不限額）
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # 允許在 GitHub 網頁上手動點擊執行，方便測試

permissions:
  contents: write # 需要寫入權限才能把最新的商品清單存回 repo

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated product list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_products.json
          git diff --staged --quiet || git commit -m "更新商品清單 [skip ci]"
          git push
